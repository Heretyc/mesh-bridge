name: Project Board Law

on:
  pull_request:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: "17 16 * * 1-5"
  workflow_dispatch:
    inputs:
      live_smoke:
        description: Run the read-only live governed Project smoke check
        required: false
        default: false
        type: boolean
      write_true_up:
        description: Run the authorized true-up writer
        required: false
        default: false
        type: boolean
      milestone:
        description: Existing or explicitly authorized true-up milestone name
        required: false
        type: string

permissions:
  contents: read

# SECRET EXPOSURE MODEL
#
# `PROJECT_CI_TOKEN` is a classic PAT carrying `project` plus `repo`/`public_repo`,
# so it reaches far beyond this repository. It must never be handed to code an
# untrusted account controls. Two paths could do so; both are closed here.
#
# 1. Pull-request content. A `pull_request` run checks out the pull request head,
#    which the author controls. That job therefore gets NO secret: it runs only the
#    token-free `identity` byte-identity check. Full compliance is the conjunction
#    of `Project Board Law / identity` and the base-controlled
#    `project-board-law/live-board` status below.
#    That event executes the workflow and any checked-out code from the BASE
#    branch, not the pull request, so it may safely hold a secret — provided it
#    never checks out or executes pull-request content, artifacts, caches, or
#    inputs. `live-board` checks out only the immutable
#    `github.event.pull_request.base.sha`, exposes the PAT to a single inspect
#    step, and publishes exactly one fixed status context,
#    `project-board-law/live-board`, using a job-scoped `statuses: write`
#    `GITHUB_TOKEN` — never the PAT. Require that context in branch protection.
#
#    The former `project-board-law/pre-merge` context is migration-only.
#
#    Portable-spoofing caveat: any account that can push a branch can also POST a
#    commit status through the REST API, so this published status is advisory
#    against a determined insider. Pair it with branch protection and review of
#    `.agents/project-board-law/**` and `.github/workflows/**`.
#
# 2. Manual dispatch. Running a workflow manually needs only write access and the
#    triggerer chooses the ref, so a `workflow_dispatch` from an attacker branch
#    would otherwise run that branch's manager with the token. Event conditions
#    alone cannot prevent this. Every token-bearing job therefore declares
#    `environment: project-board-law`; environment secrets reach only jobs that use
#    the environment and only after its protection rules pass.
#
# INSTALL REQUIREMENT: create that environment, restrict its deployment branches to
# the DEFAULT BRANCH ONLY (never `refs/pull/*/merge`), and store PROJECT_CI_TOKEN
# *in the environment*. A repository-level secret of the same name would resolve
# here regardless of the environment and silently defeat this control. An
# environment that does not exist yet is created on first use with no protection
# rules, which also defeats it. See INSTALL.md.

jobs:
  # Untrusted context: runs pull-request-controlled code, so it has no secret and
  # no Project network access. It proves only local byte identity, which needs no
  # credential. Because the checked-out code is author-controlled this check is
  # advisory; require it together with the base-controlled live-board status.
  identity:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify local byte identity without a secret
        shell: bash
        run: |
          cat > verify-identity.mjs <<'NODE'
          import { readFileSync } from "node:fs";
          import { createHash } from "node:crypto";
          import {
            LAW_SHA256,
            PAYLOADS,
            PAYLOAD_SHA256,
            RUNTIME_MANAGER_SHA256,
            RUNTIME_PACKAGE_JSON,
          } from "./.agents/project-board-law/payload.generated.js";

          const sha256 = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const fail = (message) => { console.error(message); process.exitCode = 1; };
          for (const [target, encoded] of Object.entries(PAYLOADS)) {
            if (!readFileSync(target).equals(Buffer.from(encoded, "base64"))) {
              fail(`vendored payload differs: ${target}`);
            }
          }
          const manifest = Buffer.from(Object.entries(PAYLOADS)
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([target, encoded]) => `${target}\0${sha256(Buffer.from(encoded, "base64"))}\0`)
            .join(""));
          if (sha256(manifest) !== PAYLOAD_SHA256) fail("payload manifest digest differs");
          const law = readFileSync("PROJECT-BOARD-LAW.md");
          if (sha256(law) !== LAW_SHA256) fail("PROJECT-BOARD-LAW.md does not match the vendored law digest");
          const want = Buffer.concat([
            Buffer.from("<!-- PROJECT-BOARD-LAW:BEGIN -->\n"),
            law,
            Buffer.from("<!-- PROJECT-BOARD-LAW:END -->\n"),
          ]);
          const agents = readFileSync("AGENTS.md");
          if (!agents.subarray(0, want.length).equals(want)) {
            fail("root AGENTS.md law block is not byte-identical at byte zero");
          }
          const trailing = agents.subarray(want.length);
          if (trailing.includes(Buffer.from("<!-- PROJECT-BOARD-LAW:BEGIN -->")) ||
              trailing.includes(Buffer.from("<!-- PROJECT-BOARD-LAW:END -->"))) {
            fail("root AGENTS.md has a duplicate/stray managed marker");
          }
          if (sha256(readFileSync(".agents/project-board-law/manager.js")) !== RUNTIME_MANAGER_SHA256) {
            fail("installed manager runtime digest differs");
          }
          if (!readFileSync(".agents/project-board-law/package.json").equals(Buffer.from(RUNTIME_PACKAGE_JSON))) {
            fail("installed runtime package bytes differ");
          }
          if (process.exitCode !== 1) console.log("local byte identity verified");
          NODE
          node verify-identity.mjs

  # Base-controlled trust boundary: runs on pull_request_target, so the workflow
  # and the code it checks out come from the base branch, never the pull request.
  # It checks out only the immutable base SHA, exposes the PAT to a single inspect
  # step, holds statuses:write only for the fixed live-board context, and publishes
  # that status on the merge or head commit even when inspect fails (fail-closed).
  live-board:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target'
    environment: project-board-law
    permissions:
      contents: read
      statuses: write
    env:
      PROJECT_BOARD_PROJECT_URL: ${{ vars.PROJECT_BOARD_PROJECT_URL }}
    steps:
      # Immutable base commit only. Never the pull request head, its artifacts,
      # caches, or inputs: privileged code must not execute author-controlled bytes.
      - name: Checkout the immutable base commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      # The PAT is scoped to this single step; no other step in the job sees it.
      - name: Inspect governance from base-controlled code
        id: inspect
        env:
          PROJECT_CI_TOKEN: ${{ secrets.PROJECT_CI_TOKEN }}
        shell: bash
        run: >-
          node .agents/project-board-law/manager.js inspect
          --repo "https://github.com/${GITHUB_REPOSITORY}"
          --project "$PROJECT_BOARD_PROJECT_URL"
      # Publish the fixed status with the job-scoped GITHUB_TOKEN (never the PAT).
      # Runs on success or failure so a failed inspect fails the required check.
      - name: Publish fixed project-board-law/live-board status
        if: always()
        env:
          STATUS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS_REPO: ${{ github.repository }}
          STATUS_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          STATUS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STATUS_OUTCOME: ${{ steps.inspect.outcome }}
        shell: bash
        run: |
          cat > publish-status.mjs <<'NODE'
          import { request } from "node:https";

          const hex40 = /^[0-9a-f]{40}$/;
          const token = process.env.STATUS_TOKEN;
          const repo = process.env.STATUS_REPO ?? "";
          const merge = (process.env.STATUS_MERGE_SHA ?? "").trim();
          const head = (process.env.STATUS_HEAD_SHA ?? "").trim();
          const sha = hex40.test(merge) ? merge : head;
          if (!token) { console.error("missing GITHUB_TOKEN for status publish"); process.exit(1); }
          if (!hex40.test(sha)) { console.error("no valid 40-hex target SHA for status publish"); process.exit(1); }
          const state = process.env.STATUS_OUTCOME === "success" ? "success" : "failure";
          const body = JSON.stringify({
            state,
            context: "project-board-law/live-board",
            description: `base-controlled governance ${state}`,
          });
          const req = request({
            method: "POST",
            hostname: "api.github.com",
            path: `/repos/${repo}/statuses/${sha}`,
            headers: {
              authorization: `Bearer ${token}`,
              accept: "application/vnd.github+json",
              "user-agent": "project-board-law",
              "x-github-api-version": "2022-11-28",
              "content-type": "application/json",
              "content-length": Buffer.byteLength(body),
            },
          }, (res) => {
            const chunks = [];
            res.on("data", (c) => chunks.push(c));
            res.on("end", () => {
              if ((res.statusCode ?? 0) >= 400) {
                console.error(`status publish failed ${res.statusCode}: ${Buffer.concat(chunks).toString("utf8")}`);
                process.exit(1);
              }
              console.log(`published project-board-law/live-board=${state} on ${sha}`);
            });
          });
          req.on("error", (err) => { console.error(String(err)); process.exit(1); });
          req.write(body);
          req.end();
          NODE
          node publish-status.mjs

  # Trusted context only: never runs for pull_request or pull_request_target.
  inspect:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment: project-board-law
    env:
      # Repository variable naming the governed Project, for example
      # https://github.com/users/OWNER/projects/NUMBER or
      # https://github.com/orgs/OWNER/projects/NUMBER
      PROJECT_BOARD_PROJECT_URL: ${{ vars.PROJECT_BOARD_PROJECT_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify vendored governance
        env:
          PROJECT_CI_TOKEN: ${{ secrets.PROJECT_CI_TOKEN }}
        shell: bash
        run: >-
          node .agents/project-board-law/manager.js inspect
          --repo "https://github.com/${GITHUB_REPOSITORY}"
          --project "$PROJECT_BOARD_PROJECT_URL"
      - name: Opt-in live smoke remains read-only
        if: github.event_name == 'workflow_dispatch' && inputs.live_smoke
        env:
          PROJECT_CI_TOKEN: ${{ secrets.PROJECT_CI_TOKEN }}
        shell: bash
        run: >-
          node .agents/project-board-law/manager.js inspect
          --repo "https://github.com/${GITHUB_REPOSITORY}"
          --project "$PROJECT_BOARD_PROJECT_URL"

  # Schedule always runs the default branch; dispatch may name any ref, so the
  # environment gate above is what keeps the token away from untrusted code. The
  # writes variable must be true for both paths.
  true-up:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'schedule' && vars.PROJECT_BOARD_WRITES == 'true') ||
      (github.event_name == 'workflow_dispatch' && inputs.write_true_up && vars.PROJECT_BOARD_WRITES == 'true')
    environment: project-board-law
    env:
      PROJECT_BOARD_PROJECT_URL: ${{ vars.PROJECT_BOARD_PROJECT_URL }}
      TRUE_UP_MILESTONE: ${{ github.event_name == 'workflow_dispatch' && inputs.milestone || vars.PROJECT_BOARD_TRUE_UP_MILESTONE }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Run authorized true-up
        env:
          PROJECT_CI_TOKEN: ${{ secrets.PROJECT_CI_TOKEN }}
        shell: bash
        run: >-
          node .agents/project-board-law/manager.js true-up
          --repo "https://github.com/${GITHUB_REPOSITORY}"
          --project "$PROJECT_BOARD_PROJECT_URL"
          --milestone "$TRUE_UP_MILESTONE"
      - name: Upload secret-free journal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: project-board-law-journal-${{ github.run_id }}
          path: .agents/project-board-law/journal.ndjson
          if-no-files-found: ignore
