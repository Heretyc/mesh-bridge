name: Claude Routine Verdict

on:
  issue_comment:
    types: [created, edited]

permissions:
  statuses: write
  pull-requests: read

jobs:
  routine-verdict-bridge:
    name: routine-verdict-bridge
    if: ${{ github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Post routine verdict as commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          # All GitHub event fields are untrusted metadata. The comment body is
          # parsed as data only and never executed or shell-interpolated.
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as fh:
              event = json.load(fh)

          comment = event.get("comment") or {}
          issue = event.get("issue") or {}
          body = comment.get("body") or ""

          if "## Claude Routine CI/CD" not in body:
              print("Not a Claude Routine report comment; nothing to do.")
              raise SystemExit(0)

          status_match = re.search(r"^Status:\s*(pass|fail|blocked)\b", body, re.MULTILINE)
          target_match = re.search(r"^Target SHA:\s*([0-9a-f]{7,40})\b", body, re.MULTILINE)
          if not status_match or not target_match:
              print("Routine report is missing a parseable Status or Target SHA line; "
                    "leaving the verdict status unset (fail closed).")
              raise SystemExit(0)

          verdict = status_match.group(1)
          target_sha = target_match.group(1)

          api = os.environ["GITHUB_API_URL"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          pr_number = issue.get("number")
          req = urllib.request.Request(
              f"{api}/repos/{repo}/pulls/{pr_number}", headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  pr = json.loads(resp.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"Failed to fetch PR #{pr_number}: HTTP {exc.code}")

          head_sha = ((pr.get("head") or {}).get("sha")) or ""
          if not head_sha:
              raise SystemExit(f"PR #{pr_number} has no head SHA")

          if not (head_sha == target_sha or
                  (len(target_sha) >= 7 and head_sha.startswith(target_sha))):
              print(f"Report targets {target_sha} but PR head is {head_sha}; "
                    "stale report, leaving the verdict status unset (fail closed).")
              raise SystemExit(0)

          state = "success" if verdict == "pass" else "failure"
          payload = json.dumps({
              "state": state,
              "context": "claude-routine-verdict",
              "description": f"Claude Routine verdict: {verdict} for {head_sha[:7]}",
              "target_url": comment.get("html_url") or "",
          }).encode("utf-8")
          req = urllib.request.Request(
              f"{api}/repos/{repo}/statuses/{head_sha}",
              data=payload, method="POST", headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  resp.read()
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Failed to post commit status: HTTP {exc.code}: {detail}")

          print(f"Posted claude-routine-verdict={state} on {head_sha} "
                f"(verdict {verdict}, PR #{pr_number}).")
          PY
